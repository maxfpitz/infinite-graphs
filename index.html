<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Graphs</title>
<meta name="description" content="Companion page to Max Pitz, Infinite Graphs, Graduate Texts in Mathematics, Springer: progress on the open problems stated in the book.">
<style>
  :root {
    --bg: #fdfdfb;
    --text: #1d1d1f;
    --muted: #5f5f66;
    --rule: #d9d9de;
    --link: #1f4e9c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --text: #e8e8ea;
      --muted: #a3a3ab;
      --rule: #3a3a40;
      --link: #8fb4ff;
    }
  }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 3rem 16px 4rem;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.1rem;
    line-height: 1.6;
  }
  main { max-width: 38rem; margin: 0 auto; }
  h1 { font-size: 2.2rem; font-weight: normal; margin: 0 0 0.3rem; }
  h2 {
    font-size: 1.25rem; font-weight: normal;
    margin: 2.5rem 0 0.6rem; padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--rule);
  }
  .author { font-size: 1.25rem; margin: 0; }
  .series { color: var(--muted); margin: 0.2rem 0 0; }
  .muted { color: var(--muted); }
  a { color: var(--link); }
  footer {
    max-width: 38rem; margin: 3rem auto 0;
    color: var(--muted); font-size: 0.9rem;
  }
</style>
</head>
<body>
<main>
  <h1>Infinite Graphs</h1>
  <p class="author">Max Pitz</p>
  <p class="series">Graduate Texts in Mathematics, Springer, in preparation</p>

  <h2>Open problems: progress since August 2026</h2>
  <p>The open problems in the book are stated as of August 2026.
  Progress on them since then is recorded here.</p>
  <p class="muted">No updates yet.</p>

  Contact (Max to decide before uncommenting): an email address or a link

</main>
<footer>Last updated 28 October 2026</footer>

</html>
