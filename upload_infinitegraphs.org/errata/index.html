<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Errata · Infinite Graphs</title>
<meta name="description" content="Corrections to Infinite Graphs by Max Pitz, Graduate Texts in Mathematics, Springer, by page and line.">
<!-- Source: site_src/errata/index.html (Claude, 2026-11-23, at Max's request). Entries go into the list below,
     one <li> each: page and line in the printed book, then the correction. -->
<style>
  :root { --bg:#fdfdfb; --text:#1d1d1f; --muted:#5f5f66; --rule:#d9d9de; --link:#1f4e9c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17171a; --text:#e8e8ea; --muted:#a3a3ab; --rule:#3a3a40; --link:#8fb4ff; }
  }
  html { background:var(--bg); }
  body { margin:0; padding:3rem 16px 4rem; background:var(--bg); color:var(--text);
         font-family:Georgia, "Times New Roman", serif; font-size:1.1rem; line-height:1.6; }
  main, footer { max-width:40rem; margin:0 auto; }
  .back { margin:0 0 1.2rem; font-size:1rem; }
  h1 { font-size:2.2rem; font-weight:normal; margin:0 0 .6rem; }
  h2 { font-size:1.25rem; font-weight:normal; margin:2.5rem 0 .6rem; padding-bottom:.3rem; border-bottom:1px solid var(--rule); }
  a { color:var(--link); }
  .muted { color:var(--muted); }
  ul.errata { list-style:none; margin:0; padding:0; }
  ul.errata > li { padding:.55rem 0; border-bottom:1px solid var(--rule); }
  footer { margin-top:3rem; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <p class="back"><a href="../">Infinite Graphs</a></p>
  <h1>Errata</h1>
  <p>Corrections to the book are listed here by page and line, with the date they were added.</p>

  <h2>Corrections</h2>
  <ul class="errata">
    <li class="muted">None yet.</li>
  </ul>

  <h2>Contact</h2>
  <p>Please send corrections, however small, to
  <a href="mailto:maxpitz@infinitegraphs.org">maxpitz@infinitegraphs.org</a>.</p>
</main>
<footer>Last updated 26 November 2026 · <a href="../legal.html">Imprint and Privacy Statement</a></footer>
</body>
</html>
